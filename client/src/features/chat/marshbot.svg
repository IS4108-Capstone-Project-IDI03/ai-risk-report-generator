<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- MarshBot's mark (AS-06 board 16): the Visor robot's idle face on a light blue tile, the same
       light background as the face on the Overview (.mb-face in features/marshbot/marshbot.css).
       Must match the idle face in client/src/features/marshbot/components/MarshBotFace.tsx. -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#e9f2fe"/>
      <stop offset="1" stop-color="#d3e6fb"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tile)"/>
  <g transform="translate(7 6) scale(0.4167)">
    <line x1="60" y1="13" x2="60" y2="26" stroke="#0b2a78" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="10" r="6" fill="#8fd3ff"/>
    <rect x="12" y="47" width="12" height="22" rx="6" fill="#0b2a78"/>
    <rect x="96" y="47" width="12" height="22" rx="6" fill="#0b2a78"/>
    <rect x="20" y="24" width="80" height="64" rx="24" fill="#0b2a78"/>
    <rect x="28" y="29" width="34" height="6" rx="3" fill="#fff" opacity=".14"/>
    <rect x="30" y="39" width="60" height="34" rx="17" fill="#06123f"/>
    <rect x="43" y="48" width="9" height="15" rx="4.5" fill="#8fd3ff"/>
    <rect x="68" y="48" width="9" height="15" rx="4.5" fill="#8fd3ff"/>
    <rect x="38" y="91" width="44" height="18" rx="9" fill="#000f47"/>
    <circle cx="60" cy="100" r="3.5" fill="#8fd3ff"/>
  </g>
</svg>
