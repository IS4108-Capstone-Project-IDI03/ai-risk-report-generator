# pyproject.toml over requirements.txt: one file for deps, build metadata,
# and tool config (Ruff/Black below) instead of three, and it pins a
# resolvable dependency set rather than a loose freeze.
[project]
name = "speech-ocr-service"
version = "0.1.0"
description = "S5 — stateless STT, OCR and photo interpretation, returns results only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "boto3>=1.35",
    "openai>=1.50",
    "google-genai>=1.50",   # Gemini, which interprets site photos (CP-05)
    "pillow>=11",           # upright and shrink a photo before Gemini sees it
    "ruff>=0.16.9",
    "black>=26.5.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "pytest>=8.3",
    "httpx>=0.28",   # required by fastapi.testclient.TestClient
    "pymupdf>=1.24", # reads the sample reports' photos for the CP-05 eval
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only the app is installed; eval/ is run from the source tree.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
