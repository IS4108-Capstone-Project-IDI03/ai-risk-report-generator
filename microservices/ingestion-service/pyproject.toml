# pyproject.toml over requirements.txt: one file for deps, build metadata,
# and tool config (Ruff/Black below) instead of three, and it pins a
# resolvable dependency set rather than a loose freeze.
[project]
name = "ingestion-service"
version = "0.1.0"
description = "S3 — parse, PII-guard, chunk, embed"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "cohere>=5.20,<6",
    "chromadb-client==1.5.5",
    "docling>=2.0,<3",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "pytest>=8.3",
    "httpx>=0.28",   # required by fastapi.testclient.TestClient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
