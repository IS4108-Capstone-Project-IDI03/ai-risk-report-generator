name: CI

on:
  push:
  pull_request:

jobs:
  # ── Tests ──────────────────────────────────────────────────────────────
  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm test

  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    # config.ts validates env at import time, so importing `app` in a test
    # throws without these. Dummy values only — nothing here connects out.
    env:
      MONGODB_URI: mongodb://localhost:27017/a2603-test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      INGESTION_SERVICE_URL: http://localhost:8001
      RAG_SERVICE_URL: http://localhost:8002
      SPEECH_OCR_SERVICE_URL: http://localhost:8003
      AWS_REGION: ap-southeast-1
      S3_BUCKET: ci-test-bucket

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

  # ── Lint and formatting (JS/TS) ────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [client, server]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}

      - name: ESLint
        run: npx eslint .
        working-directory: ${{ matrix.package }}

      - name: Prettier
        run: npx prettier --check .
        working-directory: ${{ matrix.package }}

  # ── Build (also typechecks — both build scripts run tsc) ───────────────
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [client, server]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.package }}

  # ── Python services ────────────────────────────────────────────────────
  python:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [ingestion-service, rag-service, speech-ocr-service]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: microservices/${{ matrix.service }}/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: microservices/${{ matrix.service }}

      - name: Ruff
        run: ruff check .
        working-directory: microservices/${{ matrix.service }}

      - name: Black
        run: black --check .
        working-directory: microservices/${{ matrix.service }}

      - name: Import smoke test
        run: python -c "from app.main import app; print(app.title)"
        working-directory: microservices/${{ matrix.service }}

      - name: Pytest
        run: pytest
        working-directory: microservices/${{ matrix.service }}

  # ── Docker images build ────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: client, context: ./client }
          - { name: server, context: ./server }
          - { name: ingestion-service, context: ./microservices/ingestion-service }
          - { name: rag-service, context: ./microservices/rag-service }
          - { name: speech-ocr-service, context: ./microservices/speech-ocr-service }

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t a2603-${{ matrix.service.name }}:ci ${{ matrix.service.context }}

  # ── Full stack smoke test ──────────────────────────────────────────────
  # Builds and boots all seven containers, then checks every health endpoint.
  # This is the only job that proves the services can actually reach each
  # other by Docker service name (see CLAUDE.md "Known pitfalls").
  compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # .env.example points MONGODB_URI at a placeholder Atlas host, which
      # the server can't reach — it calls connectDb() before listening and
      # exits if that fails. Point it at the mongo container instead.
      - name: Write CI .env
        run: |
          sed 's|^MONGODB_URI=.*|MONGODB_URI=mongodb://mongo:27017/a2603|' \
            .env.example > .env
          echo "MONGODB_URI=$(grep '^MONGODB_URI=' .env)"

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for every health endpoint
        run: |
          set -u
          check() {
            name=$1
            url=$2
            for i in $(seq 1 60); do
              if curl -fsS --max-time 3 "$url" > /tmp/out 2>/dev/null; then
                echo "OK   $name  ->  $(head -c 120 /tmp/out)"
                return 0
              fi
              sleep 2
            done
            echo "FAIL $name  ->  $url never responded (120s)"
            return 1
          }

          failed=0
          check "server"      http://localhost:4000/api/health || failed=1
          check "chroma"      http://localhost:8000/api/v2/heartbeat || failed=1
          check "ingestion"   http://localhost:8001/health     || failed=1
          check "rag"         http://localhost:8002/health     || failed=1
          check "speech-ocr"  http://localhost:8003/health     || failed=1
          check "client"      http://localhost:3000/           || failed=1
          exit $failed

      # Runs even when the checks above fail — without the logs a red run
      # tells you nothing about which container died.
      - name: Container logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=60

      - name: Tear down
        if: always()
        run: docker compose down -v
