# Self-hosted GLM-OCR for table/formula OCR (OCR_PROVIDER=glm), instead of the
# API provider the default compose uses. Downloads Ollama + the GLM-OCR model
# (~2 GB) and builds the ingestion image with the local-ocr extra:
#   docker compose -f docker-compose.yml -f docker-compose.local-ocr.yml up -d
# With an NVIDIA GPU, add docker-compose.gpu.yml as a third -f.

x-local-ocr-env: &local-ocr-env
  OCR_PROVIDER: glm
  GLMOCR_MODE: selfhosted
  GLMOCR_OCR_API_HOST: ollama
  GLMOCR_OCR_API_PORT: 11434
  GLMOCR_OCR_API_PATH: /api/generate
  GLMOCR_OCR_API_MODE: ollama_generate
  GLMOCR_OCR_MODEL: glm-ocr:latest

x-local-ocr-build: &local-ocr-build
  context: ./microservices/ingestion-service
  args:
    UV_EXTRAS: "--extra cpu --extra local-ocr"

services:
  ollama:
    image: ollama/ollama:0.40.0
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Pulls the GLM-OCR model into the Ollama volume once, then exits.
  # The ingestion services wait for it so the model is ready.
  ollama-pull:
    image: ollama/ollama:0.40.0
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "glm-ocr"]
    depends_on:
      ollama:
        condition: service_healthy

  ingestion-service:
    image: ai-risk-report-generator-ingestion:local-ocr
    build:
      <<: *local-ocr-build
      target: production
    environment: *local-ocr-env
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ingestion-worker:
    image: ai-risk-report-generator-ingestion:local-ocr
    build:
      <<: *local-ocr-build
      target: production
    environment: *local-ocr-env
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

  ingestion-test:
    build:
      <<: *local-ocr-build
      target: test
    environment: *local-ocr-env
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama-data:
