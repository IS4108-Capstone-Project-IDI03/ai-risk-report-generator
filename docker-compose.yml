services:
# Backend services use `restart: unless-stopped`: Docker restarts them after a
# crash (e.g. the ingestion worker killed for memory on a huge PDF) and when the
# instance boots, so a stop/start needs no manual `docker compose up`.
  # Local Chroma and Mongo for laptops: `docker compose --profile local-db up`.
  # The cloud box uses Chroma Cloud (CHROMA_MODE=cloud) and Atlas (MONGODB_URI)
  # instead, so these stay off by default and other services' depends_on on
  # them is `required: false`.
  chroma:
    image: chromadb/chroma:1.5.5
    profiles: ["local-db"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma-data:/data

  # BullMQ's job queue (IN-01). Append-only persistence, so queued jobs
  # survive a restart.
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    # noeviction: BullMQ must never have queued jobs evicted under memory pressure.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    profiles: ["local-db"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    restart: unless-stopped
    build: ./server
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      # Overrides the localhost defaults from .env — inside this container,
      # the other services are reachable by Docker service name, not
      # localhost. See CLAUDE.md "Known pitfalls".
      INGESTION_SERVICE_URL: http://ingestion-service:8001
      RAG_SERVICE_URL: http://rag-service:8002
      SPEECH_OCR_SERVICE_URL: http://speech-ocr-service:8003
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_started
        required: false
      redis:
        condition: service_started
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Vite's dev-server proxy target — inside this container, `server`
      # is reachable by Docker service name, not localhost. See CLAUDE.md
      # "Known pitfalls".
      SERVER_URL: http://server:4000
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

  # ingestion-service and ingestion-worker share one image (same tag), so it
  # is built and stored once.
  ingestion-service:
    restart: unless-stopped
    image: ai-risk-report-generator-ingestion:cloud
    build:
      context: ./microservices/ingestion-service
      target: production
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      # Table/formula OCR goes to OCR_PROVIDER (from .env). For self-hosted
      # GLM-OCR add docker-compose.local-ocr.yml (and docker-compose.gpu.yml).
    depends_on:
      chroma:
        condition: service_started
        required: false

  # Takes queued knowledge documents one at a time and runs the pipeline
  # (app/worker.py). Same image as ingestion-service, different command.
  ingestion-worker:
    restart: unless-stopped
    image: ai-risk-report-generator-ingestion:cloud
    build:
      context: ./microservices/ingestion-service
      target: production
    command: ["uv", "run", "python", "-m", "app.worker"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      # Inside the network the gateway is the `server` service, not localhost
      # (CLAUDE.md pitfall: environment: beats env_file:). The worker posts
      # ingestion notifications here (IN-10).
      GATEWAY_URL: http://server:4000
      # Table/formula OCR goes to OCR_PROVIDER (from .env). For self-hosted
      # GLM-OCR add docker-compose.local-ocr.yml (and docker-compose.gpu.yml).
    depends_on:
      redis:
        condition: service_started
      chroma:
        condition: service_started
        required: false

  ingestion-test:
    build:
      context: ./microservices/ingestion-service
      target: test
    command: ["uv", "run", "pytest", "-q", "--tb=short", "-m", "not slow and not inspect and not live"]
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      # Docling models and the tokenizer are built into the image; never
      # contact huggingface.co from a container.
      HF_HUB_OFFLINE: "1"
    volumes:
      # Mount the test fixture PDFs (excluded from the image by .dockerignore).
      - ./microservices/ingestion-service/tests/test_files:/app/tests/test_files:ro
    depends_on:
      chroma:
        condition: service_started
        required: false
    profiles:
      - test

  rag-service:
    restart: unless-stopped
    build: ./microservices/rag-service
    ports:
      - "127.0.0.1:8002:8002"
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    depends_on:
      chroma:
        condition: service_started
        required: false
    volumes:
      - ./microservices/rag-service:/app

  speech-ocr-service:
    restart: unless-stopped
    build: ./microservices/speech-ocr-service
    ports:
      - "127.0.0.1:8003:8003"
    env_file: .env
    depends_on:
      - server
    volumes:
      - ./microservices/speech-ocr-service:/app

volumes:
  redis-data:
  mongo-data:
  chroma-data:
