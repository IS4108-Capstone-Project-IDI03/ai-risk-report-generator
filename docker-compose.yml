services:
  chroma:
    image: chromadb/chroma:1.5.5
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma-data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      # Overrides the localhost defaults from .env — inside this container,
      # the other services are reachable by Docker service name, not
      # localhost. See CLAUDE.md "Known pitfalls".
      INGESTION_SERVICE_URL: http://ingestion-service:8001
      RAG_SERVICE_URL: http://rag-service:8002
      SPEECH_OCR_SERVICE_URL: http://speech-ocr-service:8003
    depends_on:
      - mongo
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Vite's dev-server proxy target — inside this container, `server`
      # is reachable by Docker service name, not localhost. See CLAUDE.md
      # "Known pitfalls".
      SERVER_URL: http://server:4000
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

  ingestion-service:
    build: ./microservices/ingestion-service
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      GLMOCR_MODE: selfhosted
      GLMOCR_OCR_API_HOST: ollama
      GLMOCR_OCR_API_PORT: 11434
    depends_on:
      - chroma
      ollama:
        condition: service_healthy
    volumes:
      - ./microservices/ingestion-service:/app

  rag-service:
    build: ./microservices/rag-service
    ports:
      - "127.0.0.1:8002:8002"
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    depends_on:
      - chroma
    volumes:
      - ./microservices/rag-service:/app

  speech-ocr-service:
    build: ./microservices/speech-ocr-service
    ports:
      - "8003:8003"
    env_file: .env
    depends_on:
      - server
    volumes:
      - ./microservices/speech-ocr-service:/app

volumes:
  mongo-data:
  chroma-data:
  ollama-data:
