services:
# GPU support for self-hosted OCR (needs an NVIDIA GPU). Layer it on the
# local-OCR overlay:
#   docker compose -f docker-compose.yml -f docker-compose.local-ocr.yml -f docker-compose.gpu.yml up -d
# It builds the ingestion image with CUDA torch + Nemotron (--extra gpu).

# To check local GLM-OCR's gpu usage (Or other models as more is added), run 
# docker compose exec ollama ollama ps
# If nothing is shown, run an ingestion job that requires OCR, then run the command again to see the GPU usage.
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ingestion-service:
    image: ai-risk-report-generator-ingestion:gpu
    build:
      args:
        UV_EXTRAS: "--extra gpu --extra local-ocr"
    environment:
      # Signals to the ingestion pipeline that GPU support is active.
      # ocr_config.py reads this to select NemotronOcrOptions (fastest with GPU)
      # instead of the CPU fallback (RapidOCR).
      GPU_ENABLED: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ingestion-worker:
    image: ai-risk-report-generator-ingestion:gpu
    build:
      args:
        UV_EXTRAS: "--extra gpu --extra local-ocr"
    environment:
      # Same signal for the background worker process.
      GPU_ENABLED: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
